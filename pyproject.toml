[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freebie-api"
version = "0.1.0"
description = "High-performance OpenAI-compatible proxy reverse-engineering ChatGPT Web with zero-auth Gemini Flash fallback"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Ranveer Kumar (RABNEER)", email = "kr715ranveer@gmail.com" }
]
keywords = ["freebie", "chatgpt", "gemini", "openai", "api-proxy", "llm", "ai", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "curl_cffi>=0.7.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "sse-starlette>=2.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "build>=1.1.0",
    "twine>=5.0.0",
]

[project.scripts]
freebie = "freebie.__main__:main"
freegpt = "freebie.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["freebie*"]
exclude = ["tests*", "docs*"]
